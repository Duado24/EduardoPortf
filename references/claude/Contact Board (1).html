<style>

.c i{font-style:normal;color:var(--coral);margin-left:10px;font-size:13px;display:inline-block;transition:transform .15s}
.c:hover .val{border-bottom-color:var(--coral)}.c:hover i{transform:translate(2px,-2px)}

.github{grid-column:3;grid-row:2;justify-self:end;text-align:left}
.linkedin{grid-column:1;grid-row:3;align-self:end}
.resume{grid-column:3;grid-row:3;align-self:end;justify-self:end}

.foot a:hover,.foot button:hover{color:var(--ink)}.foot .arrow{color:var(--coral)}
